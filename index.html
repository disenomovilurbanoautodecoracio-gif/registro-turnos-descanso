<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignación de Descansos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px 20px; }
        
        /* Se aumentó max-width de 500px a 650px y se amplió el padding */
        .card { 
            position: relative; 
            max-width: 650px; 
            margin: 0 auto; 
            background: white; 
            padding: 40px 35px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center;
        }
        
        /* Estilo y centrado del Logo */
        .logo { 
            display: block;
            margin: 0 auto 20px auto; 
            max-width: 90px; /* Tamaño del logo ligeramente ajustado a la nueva escala */
            height: auto; 
        }

        /* Estilo y centrado del Título */
        .card h2 { 
            margin-top: 0; 
            margin-bottom: 25px;
            color: #333; 
            font-size: 24px; 
            text-align: center;
        } 

        label { margin-top: 18px; display: block; font-weight: bold; text-align: left; font-size: 15px; }
        input, select, button { width: 100%; padding: 12px; margin-top: 6px; box-sizing: border-box; font-size: 15px; }
        
        button { 
            background-color: #3498db; 
            color: white; 
            border: none; 
            font-size: 16px; 
            font-weight: bold;
            margin-top: 25px; 
            cursor: pointer; 
            border-radius: 6px; 
            transition: background-color 0.2s ease;
        }
        button:hover { background-color: #2980b9; }

        table { width: 100%; margin-top: 25px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 15px; }
        th { background-color: #1626D9; color: white; }
    </style>
</head>
<body>

    <img src="9-1-1.jpg" alt="Logo de la empresa" class="logo">
