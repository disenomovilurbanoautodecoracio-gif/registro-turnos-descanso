<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Turnos de Salida</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; }
    button { background-color: #28a745; color: white; border: none; font-size: 16px; margin-top: 20px; cursor: pointer; border-radius: 4px; }
    button:hover { background-color: #218838; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #f4f4f4; }
  </style>
</head>
<body>

<div class="card">
  <h2>Registro de Ingreso y Asignación de Salida</h2>
  
  <label for="userId">ID o Nombre del Colaborador:</label>
  <input type="text" id="userId" placeholder="Ej. Evelyn o ID-1234">

  <label for="turnoHora">Hora del Turno de Ingreso:</label>
  <select id="turnoHora">
    <option value="21:00">21:00 hrs</option>
  </select>

  <button onclick="registrarTurno()">Registrar e Imprimir Turno de Salida</button>
</div>

<h3>Historial de Registros</h3>
<table>
  <thead>
    <tr>
      <th>ID / Nombre</th>
      <th>Hora Registro</th>
      <th>Turno Ingreso</th>
      <th>Turno Salida Asignado</th>
    </tr>
  </thead>
  <tbody id="tablaRegistros"></tbody>
</table>

<script>
  const opcionesSalida = {
    "21:00": ["23:00", "10:00", "02:15"]
  };

  function registrarTurno() {
    const id = document.getElementById('userId').value.trim();
    const turno = document.getElementById('turnoHora').value;

    if (!id) {
      alert("Por favor ingresa un ID o Nombre.");
      return;
    }

    const ahora = new Date();
    const horaRegistro = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

    const opciones = opcionesSalida[turno] || ["Sin turno asignado"];
    const salidaAsignada = opciones[Math.floor(Math.random() * opciones.length)];

    const tabla = document.getElementById('tablaRegistros');
    const fila = `<tr>
      <td>${id}</td>
      <td>${horaRegistro}</td>
      <td>${turno}</td>
      <td><strong>${salidaAsignada}</strong></td>
    </tr>`;
    tabla.innerHTML = fila + tabla.innerHTML;

    document.getElementById('userId').value = '';
  }
</script>

</body>
</html>
